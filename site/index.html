    <style>
      :root {
        --bg: #0e0e10;
        --bg-alt: #161618;
        --panel: #1a1a1d;

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      /* Header */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 32px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-alt);
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(145deg, #3f3f46, #18181b);
        border: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .logo svg {
        width: 22px;
        height: 22px;
      }
      .title-group h1 {
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }
      .title-group p {
        font-size: 13px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      /* Main grid */
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        padding: 24px 32px;
        max-width: 1500px;
        width: 100%;
        margin: 0 auto;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 480px;
        transition: border-color 0.15s;
      }
      .panel:focus-within {
        border-color: var(--border-light);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-alt);
      }
      .panel-head .label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .panel-head .label svg {
        width: 15px;
        height: 15px;
        opacity: 0.7;
      }
      textarea {
        flex: 1;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        font-family:
          "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.65;
        padding: 18px;
        resize: none;
        outline: none;
        tab-size: 2;
      }
      textarea::placeholder {
        color: var(--text-faint);
      }
      #output {
        white-space: pre;
        overflow: auto;
        color: var(--text-dim);
      }
      /* Icon button */
      .icon-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--border-light);
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.15s;

      .icon-btn:hover {
        background: var(--panel-hover);
        color: var(--text);
        border-color: #52525b;
      }
      .icon-btn svg {
        width: 14px;
        height: 14px;
      }
      /* Action bar */
      .actionbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 32px 24px;
        max-width: 1500px;
        width: 100%;
        margin: 0 auto;

      button.primary {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--text);
        color: var(--bg);
        border: 0;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 22px;
        border-radius: 8px;

        align-items: center;

        width: 15px;
        height: 15px;

        color: var(--ok);

      #status.err {
        color: var(--err);

        padding: 18px 32px;
        border-top: 1px solid var(--border);
        background: var(--bg-alt);
        font-size: 12px;
        color: var(--text-faint);

        align-items: center;
        justify-content: center;

        flex-wrap: wrap;

        color: var(--border-light);

      footer a:hover {

        background: var(--border-light);
        border-radius: 5px;

    <script>
      const LURIPE_VM_SOURCE = "--[[\n  vm.lua - Luripe runtime virtual machine (Lua-in-Lua)\n  Rolling cipher + constant pool edition.\n    - Rolling string decode: position/chain-dependent keystream.\n        ks_i = seed ~ (i * PRIME) ~ prev_encoded\n        char = ((e_i ~ ks_i) & 0xFF) - OFFSET ; prev := e_i\n      encoded[1] is the per-string SEED.\n    - LOADK: numeric constants come from the CONSTS pool (also encoded).\n  Usage: VM.run(program, OPMAP, checksum, CONSTS)\n]]\n\nlocal KEY, OFFSET = 0x5A, 7\nlocal PRIME, CMASK = 167, 0xFF\n\nlocal function decodeString(encoded)\n  local seed = encoded[1]\n  local prev = seed\n  local chars = {}\n  for i = 2, #encoded do\n    local e = encoded[i]\n    local ks = (seed ~ ((i - 1) * PRIME) ~ prev) & CMASK\n    local c = ((e ~ ks) & CMASK) - OFFSET\n    if c < 0 then c = c + 256 end\n    chars[i - 1] = string.char(c & CMASK)\n    prev = e\n  end\n  return table.concat(chars)\nend\n\nlocal function decodeNumber(encoded)\n  return tonumber(decodeString(encoded))\nend\n\nlocal BUILTINS = {\n  [1]  = function(a) return math.floor(a[1]) end,\n  [2]  = function(a) return math.ceil(a[1]) end,\n  [3]  = function(a) return math.abs(a[1]) end,\n  [4]  = function(a) return math.max(a[1], a[2]) end,\n  [5]  = function(a) return math.min(a[1], a[2]) end,\n  [6]  = function(a) return string.upper(a[1]) end,\n  [7]  = function(a) return string.lower(a[1]) end,\n  [8]  = function(a) return #a[1] end,\n  [9]  = function(a) return string.rep(a[1], a[2]) end,\n  [10] = function(a) return tostring(a[1]) end,\n  [11] = function(a) return tonumber(a[1]) end,\n  [12] = function(a) table.insert(a[1], a[2]); return 0 end,\n  [13] = function(a) return math.sqrt(a[1]) end,\n  [14] = function(a) return math.random(a[1], a[2]) end,\n  [15] = function(a) return a[1] ^ a[2] end,\n  [16] = function(a) return string.sub(a[1], a[2], a[3]) end,\n  [17] = function(a) return string.format(a[1], a[2], a[3], a[4]) end,\n  [18] = function(a) return string.reverse(a[1]) end,\n  [19] = function(a) return string.byte(a[1], a[2]) end,\n  [20] = function(a) return string.char(a[1]) end,\n  [21] = function(a) return table.remove(a[1], a[2]) end,\n  [22] = function(a) return table.concat(a[1], a[2] or \"\") end,\n  [23] = function(a) return type(a[1]) end,\n  [24] = function(a) return math.sin(a[1]) end,\n  [25] = function(a) return math.cos(a[1]) end,\n}\n\nlocal function checksumOf(program)\n  local sum = 0\n  for i = 1, #program do\n    local inst = program[i]\n    sum = (sum + inst[1] * i) % 1000003\n    if type(inst[2]) == \"number\" then sum = (sum + inst[2]) % 1000003 end\n  end\n  return sum\nend\n\nlocal function run(program, OP, expectedChecksum, CONSTS)\n  if expectedChecksum ~= nil and checksumOf(program) ~= expectedChecksum then\n    error(\"Luripe: tampering detected\")\n  end\n\n  local K = {}\n  if CONSTS then\n    for i = 1, #CONSTS do K[i - 1] = decodeNumber(CONSTS[i]) end\n  end\n\n  local stack, sp = {}, 0\n  local function push(v) sp = sp + 1; stack[sp] = v end\n  local function pop() local v = stack[sp]; stack[sp] = nil; sp = sp - 1; return v end\n\n  local frame = {}\n  local upvals = {}\n  local callStack, csTop = {}, 0\n  local ip = 1\n\n  while ip <= #program do\n    local inst = program[ip]\n    local op, arg = inst[1], inst[2]\n\n    if op == OP.PUSH then push(arg)\n    elseif op == OP.LOADK then push(K[arg])\n    elseif op == OP.POP then pop()\n    elseif op == OP.ADD then local b = pop(); local a = pop(); push(a + b)\n    elseif op == OP.SUB then local b = pop(); local a = pop(); push(a - b)\n    elseif op == OP.MUL then local b = pop(); local a = pop(); push(a * b)\n    elseif op == OP.DIV then local b = pop(); local a = pop(); push(a / b)\n    elseif op == OP.MOD then local b = pop(); local a = pop(); push(a % b)\n    elseif op == OP.PRINT then print(stack[sp])\n    elseif op == OP.DUP then push(stack[sp])\n    elseif op == OP.STORE then frame[arg] = pop()\n    elseif op == OP.LOAD then push(frame[arg])\n    elseif op == OP.PUSHSTR then push(decodeString(arg))\n    elseif op == OP.CONCAT then local b = pop(); local a = pop(); push(tostring(a) .. tostring(b))\n    elseif op == OP.LT then local b = pop(); local a = pop(); push(a <  b and 1 or 0)\n    elseif op == OP.GT then local b = pop(); local a = pop(); push(a >  b and 1 or 0)\n    elseif op == OP.LE then local b = pop(); local a = pop(); push(a <= b and 1 or 0)\n    elseif op == OP.GE then local b = pop(); local a = pop(); push(a >= b and 1 or 0)\n    elseif op == OP.EQ then local b = pop(); local a = pop(); push(a == b and 1 or 0)\n    elseif op == OP.NE then local b = pop(); local a = pop(); push(a ~= b and 1 or 0)\n    elseif op == OP.JMP then ip = arg; goto continue\n    elseif op == OP.JZ then local top = pop(); if top == 0 then ip = arg; goto continue end\n    elseif op == OP.NEWTABLE then push({})\n    elseif op == OP.SETTABLE then local v = pop(); local k = pop(); local t = pop(); t[k] = v\n    elseif op == OP.GETTABLE then local k = pop(); local t = pop(); push(t[k])\n    elseif op == OP.TLEN then local t = pop(); push(#t)\n    elseif op == OP.NOT then local a = pop(); push((a == 0 or a == false or a == nil) and 1 or 0)\n\n    elseif op == OP.BUILTIN then\n      local id, argc = arg[1], arg[2]\n      local args = {}\n      for k = argc, 1, -1 do args[k] = pop() end\n      push(BUILTINS[id](args))\n\n    elseif op == OP.CALL then\n      local funcAddr, argc = arg[1], arg[2]\n      local newFrame = {}\n      for k = argc - 1, 0, -1 do newFrame[k] = pop() end\n      csTop = csTop + 1\n      callStack[csTop] = { retIp = ip + 1, frame = frame }\n      frame = newFrame\n      ip = funcAddr\n      goto continue\n    elseif op == OP.RETURN then\n      local rv = pop()\n      local caller = callStack[csTop]\n      callStack[csTop] = nil\n      csTop = csTop - 1\n      frame = caller.frame\n      push(rv)\n      ip = caller.retIp\n      goto continue\n\n    elseif op == OP.RETURNN then\n      local n =       const OFFSET = 7, PRIME = 167, CMASK = 0xff, HARDENING = true;

      function encodeString(str) {
        const seed = 1 + Math.floor(Math.random() * 254);
        const out = [seed];
        let prev = seed;
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          const ks = (seed ^ ((i + 1) * PRIME) ^ prev) & CMASK;
          const e = ((c + OFFSET) & CMASK) ^ ks;
          out.push(e);
          prev = e;
        }
        return out;
      }
      function encodeNumber(n) { return encodeString(String(n)); }

      const OPS = [
        "PUSH","ADD","SUB","MUL","PRINT","JMP","JZ","DUP","HALT","STORE",
        "LOAD","DIV","PUSHSTR","POP","LT","GT","LE","GE","EQ","NE","CALL",
        "RETURN","NEWTABLE","SETTABLE","GETTABLE","CONCAT","BUILTIN","TLEN",
        "MOD","RETURNN","STOREMULTI","VARARG","NOT","NEWCELL","LOADCELL",
        "STORECELL","LOADUP","STOREUP","CLOSURE","CALLC","LOADK",
      ];
      function buildOpcodeMap() {
        const nums = [];
        for (let i = 1; i <= OPS.length; i++) nums.push(i);
        for (let i = nums.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [nums[i], nums[j]] = [nums[j], nums[i]];
        }
        const map = {};
        OPS.forEach((name, i) => { map[name] = nums[i]; });
        return map;
      }

      const BUILTIN_IDS = {
        "math.floor": { id: 1, argc: 1 }, "math.ceil": { id: 2, argc: 1 },
        "math.abs": { id: 3, argc: 1 }, "math.max": { id: 4, argc: 2 },
        "math.min": { id: 5, argc: 2 }, "string.upper": { id: 6, argc: 1 },
        "string.lower": { id: 7, argc: 1 }, "string.len": { id: 8, argc: 1 },
        "string.rep": { id: 9, argc: 2 }, tostring: { id: 10, argc: 1 },
        tonumber: { id: 11, argc: 1 }, "table.insert": { id: 12, argc: 2 },
        "math.sqrt": { id: 13, argc: 1 }, "math.random": { id: 14, argc: 2 },
        "math.pow": { id: 15, argc: 2 }, "string.sub": { id: 16, argc: 3 },
        "string.format": { id: 17, argc: 4 }, "string.reverse": { id: 18, argc: 1 },
        "string.byte": { id: 19, argc: 2 }, "string.char": { id: 20, argc: 1 },
        "table.remove": { id: 21, argc: 2 }, "table.concat": { id: 22, argc: 2 },
        type: { id: 23, argc: 1 }, "math.sin": { id: 24, argc: 1 },
        "math.cos": { id: 25, argc: 1 },
      };

      function compile(source) {
        const OP = buildOpcodeMap();
        const ast = luaparse.parse(source);
        const bytecode = [];

        const constPool = [];
        const constIndex = new Map();
        const constFor = (value) => {
          if (constIndex.has(value)) return constIndex.get(value);
          const idx = constPool.length;
          constPool.push(encodeNumber(value));
          constIndex.set(value, idx);
          return idx;
        };
        const emitNumber = (value) => emit(OP.LOADK, constFor(value));

        const emit = (op, arg) => {
          bytecode.push(arg === undefined ? { op } : { op, arg });
          return bytecode.length - 1;
        };
        const patch = (index, target) => { bytecode[index].arg = target; };
        const here = () => bytecode.length + 1;

        const functions = {};
        let scope = {};
        let varargSlot = 0;
        let nextSlot = 0;
        const slotFor = (name) => {
          if (scope[name] === undefined) scope[name] = nextSlot++;
          return scope[name];
        };

        const CMP = { "<": "LT", ">": "GT", "<=": "LE", ">=": "GE", "==": "EQ", "~=": "NE" };
        const emitJunk = () => {
          if (HARDENING) { emitNumber(Math.floor(Math.random() * 99999)); emit(OP.POP); }
        };

        function builtinName(node) {
          if (node.type === "MemberExpression" && node.base.type === "Identifier")
            return node.base.name + "." + node.identifier.name;
          if (node.type === "Identifier") return node.name;
          return null;
        }

        function compileExpr(node) {
          if (node.type === "NumericLiteral") {
            emitNumber(node.value);
          } else if (node.type === "StringLiteral") {
            let str = node.value;
            if (str === null || str === undefined) str = node.raw.slice(1, -1);
            emit(OP.PUSHSTR, encodeString(str));
          } else if (node.type === "Identifier") {
            const slot = scope[node.name];
            if (slot === undefined) throw new Error("hindi pa naka-declare: " + node.name);
            emit(OP.LOAD, slot);
          } else if (node.type === "BinaryExpression") {
            compileExpr(node.left);
            compileExpr(node.right);
            const o = node.operator;
            if (o === "+") emit(OP.ADD);
            else if (o === "-") emit(OP.SUB);
            else if (o === "*") emit(OP.MUL);
            else if (o === "/") emit(OP.DIV);
            else if (o === "%") emit(OP.MOD);
            else if (o === "..") emit(OP.CONCAT);
            else if (CMP[o]) emit(OP[CMP[o]]);
            else throw new Error("hindi sinusuportahan ang operator: " + o);
          } else if (node.type === "CallExpression") {
            compileCall(node);
          } else if (node.type === "TableConstructorExpression") {
            emit(OP.NEWTABLE);
            let arrayIndex = 1;
            for (const field of node.fields) {
              if (field.type === "TableValue") {
                emit(OP.DUP); emitNumber(arrayIndex++); compileExpr(field.value); emit(OP.SETTABLE);
              } else if (field.type === "TableKeyString") {
                emit(OP.DUP); emit(OP.PUSHSTR, encodeString(field.key.name)); compileExpr(field.value); emit(OP.SETTABLE);
              } else throw new Error("hindi pa sinusuportahan ang table field: " + field.type);
            }
          } else if (node.type === "IndexExpression") {
            compileExpr(node.base); compileExpr(node.index); emit(OP.GETTABLE);
          } else if (node.type === "MemberExpression") {
            compileExpr(node.base); emit(OP.PUSHSTR, encodeString(node.identifier.name)); emit(OP.GETTABLE);
          } else if (node.type === "UnaryExpression") {
            if (node.operator === "-") { emitNumber(0); compileExpr(node.argument); emit(OP.SUB); }
            else if (node.operator === "not") { compileExpr(node.argument); emit(OP.NOT); }
            else if (node.operator === "#") { compileExpr(node.argument); emit(OP.TLEN); }
            else throw new Error("hindi sinusuportahan ang unary operator: " + node.operator);
          } else throw new Error("hindi sinusuportahan ang expression: " + node.type);
        }

        function compileCall(node) {
          if (node.base && node.base.type === "Identifier" && node.base.name === "print") {
            compileExpr(node.arguments[0]); emit(OP.PRINT); return;
          }
          const bname = builtinName(node.base);
          if (bname && BUILTIN_IDS[bname]) {
            const b = BUILTIN_IDS[bname];
            for (const a of node.arguments) compileExpr(a);
            emit(OP.BUILTIN, [b.id, node.arguments.length]); return;
          }
          const fnName = node.base && node.base.name;
          const fn = functions[fnName];
          if (!fn) throw new Error("hindi kilalang function: " + (fnName || bname));
          for (const a of node.arguments) compileExpr(a);
          emit(OP.CALL, [fn.addr, node.arguments.length]);
        }

        function compileAssignTarget(target, valueEmitter) {
          if (target.type === "Identifier") {
            const slot = slotFor(target.name); valueEmitter(); emit(OP.STORE, slot);
          } else if (target.type === "IndexExpression") {
            compileExpr(target.base); compileExpr(target.index); valueEmitter(); emit(OP.SETTABLE);
          } else if (target.type === "MemberExpression") {
            compileExpr(target.base); emit(OP.PUSHSTR, encodeString(target.identifier.name)); valueEmitter(); emit(OP.SETTABLE);
          } else throw new Error("hindi sinusuportahan ang assignment target: " + target.type);
        }

        function compileBlock(body) {
          for (const stmt of body) { emitJunk(); compileStatement(stmt); }
        }

        function compileStatement(node) {
          if (node.type === "LocalStatement") {
            for (let i = 0; i < node.variables.length; i++) {
              const name = node.variables[i].name;
              if (node.init[i]) compileExpr(node.init[i]); else emitNumber(0);
              emit(OP.STORE, slotFor(name));
            }
          } else if (node.type === "AssignmentStatement") {
            for (let i = 0; i < node.variables.length; i++)
              compileAssignTarget(node.variables[i], () => compileExpr(node.init[i]));
          } else if (node.type === "CallStatement") {
            compileCall(node.expression);
          } else if (node.type === "IfStatement") {
            const endJumps = [];
            for (const clause of node.clauses) {
              if (clause.type === "ElseClause") { compileBlock(clause.body); continue; }
              compileExpr(clause.condition);
              const jz = emit(OP.JZ, 0);
              compileBlock(clause.body);
              endJumps.push(emit(OP.JMP, 0));
              patch(jz, here());
            }
            for (const j of endJumps) patch(j, here());
          } else if (node.type === "WhileStatement") {
            const top = here();
            compileExpr(node.condition);
            const jz = emit(OP.JZ, 0);
            compileBlock(node.body);
            emit(OP.JMP, top);
            patch(jz, here());
          } else if (node.type === "NumericForStatement") {
            const varSlot = slotFor(node.variable.name);
            compileExpr(node.start); emit(OP.STORE, varSlot);
            const limitSlot = nextSlot++;
            compileExpr(node.end); emit(OP.STORE, limitSlot);
            const stepSlot = nextSlot++;
            if (node.step) compileExpr(node.step); else emitNumber(1);
            emit(OP.STORE, stepSlot);
            const top = here();
            emit(OP.LOAD, varSlot); emit(OP.LOAD, limitSlot); emit(OP.LE);
            const jz = emit(OP.JZ, 0);
            compileBlock(node.body);
            emit(OP.LOAD, varSlot); emit(OP.LOAD, stepSlot); emit(OP.ADD); emit(OP.STORE, varSlot);
            emit(OP.JMP, top);
            patch(jz, here());
          } else if (node.type === "ForGenericStatement") {
            const iterCall = node.iterators[0];
            const tExpr = iterCall.arguments[0];
            const tSlot = nextSlot++;
            compileExpr(tExpr); emit(OP.STORE, tSlot);
            const idxSlot = nextSlot++;
            emitNumber(1); emit(OP.STORE, idxSlot);
            const lenSlot = nextSlot++;
            emit(OP.LOAD, tSlot); emit(OP.TLEN); emit(OP.STORE, lenSlot);
            const keyVar = node.variables[0] ? slotFor(node.variables[0].name) : nextSlot++;
            const valVar = node.variables[1] ? slotFor(node.variables[1].name) : nextSlot++;
            const top = here();
            emit(OP.LOAD, idxSlot); emit(OP.LOAD, lenSlot); emit(OP.LE);
            const jz = emit(OP.JZ, 0);
            emit(OP.LOAD, idxSlot); emit(OP.STORE, keyVar);
            emit(OP.LOAD, tSlot); emit(OP.LOAD, idxSlot); emit(OP.GETTABLE); emit(OP.STORE, valVar);
            compileBlock(node.body);
            emit(OP.LOAD, idxSlot); emitNumber(1); emit(OP.ADD); emit(OP.STORE, idxSlot);
            emit(OP.JMP, top);
            patch(jz, here());
          } else if (node.type === "ReturnStatement") {
            if (node.arguments.length === 0) { emitNumber(0); emit(OP.RETURN); }
            else if (node.arguments.length === 1) { compileExpr(node.arguments[0]); emit(OP.RETURN); }
            else { for (const a of node.arguments) compileExpr(a); emit(OP.RETURNN, node.arguments.length); }
          } else if (node.type === "FunctionDeclaration" && node.identifier) {
            const jmpOver = emit(OP.JMP, 0);
            const addr = here();
            const qname = node.identifier.name;
            functions[qname] = { addr };
            const savedScope = scope, savedNextSlot = nextSlot, savedVararg = varargSlot;
            scope = {}; nextSlot = 0; varargSlot = 0;
            for (const p of node.parameters) {
              if (p.type === "VarargLiteral") varargSlot = nextSlot; else slotFor(p.name);
            }
            compileBlock(node.body);
            emitNumber(0); emit(OP.RETURN);
            scope = savedScope; nextSlot = savedNextSlot; varargSlot = savedVararg;
            patch(jmpOver, here());
          } else if (node.type === "DoStatement") {
            compileBlock(node.body);
          } else throw new Error("hindi sinusuportahan ang statement: " + node.type);
        }

        compileBlock(ast.body);
        emit(OP.HALT);
        return { OP, bytecode, constPool };
      }

      function checksumOf(bytecode) {
        let sum = 0;
        for (let i = 0; i < bytecode.length; i++) {
          const inst = bytecode[i];
          const op = inst.op;
          sum = (sum + op * (i + 1)) % 1000003;
          if (typeof inst.arg === "number") sum = (sum + inst.arg) % 1000003;
        }
        return sum;
      }

      function minifyLua(src) {
        return src
          .replace(/--\[\[[\s\S]*?\]\]/g, "")
          .replace(/--[^\n]*/g, "")
          .split("\n").map((l) => l.trim()).filter((l) => l.length).join(" ")
          .replace(/\s+/g, " ");
      }
      function scrambleVM(vmMin) {
        const names = [
          "decodeString","decodeNumber","checksumOf","BUILTINS","callStack","csTop",
          "newFrame","expectedChecksum","funcAddr","chars","encoded","vals","slots",
          "startSlot","caller","push","pop","frame","upvals","stack","program","inst",
          "argc","retIp","newTable",
        ];
        for (const nm of names) {
          const scrambled = "_" + Math.random().toString(36).slice(2, 7);
          vmMin = vmMin.replace(new RegExp("\\b" + nm + "\\b", "g"), scrambled);
        }
        return vmMin;
      }

      function bundle(OP, bytecode, constPool) {
        const checksum = checksumOf(bytecode);
        return luraphBundle(OP, bytecode, LURIPE_VM_SOURCE, checksum, constPool);
      }

      function luraphBundle(OP, bytecode, vmRaw, checksum, constPool) {
        const rn = () => "_" + Math.random().toString(36).slice(2, 7);
        function junkLine() {
          const v = rn(), w = rn(), x = rn();
          const a = Math.floor(Math.random() * 999), b = Math.floor(Math.random() * 99) + 1;
          const patterns = [
            () => "local " + v + "=" + Math.floor(Math.random() * 99999) + ";",
            () => "local " + v + "=function(" + w + ") return " + w + " and " + a + " or nil end;",
            () => "local " + v + "={" + a + "," + b + "," + Math.floor(Math.random() * 99) + "};",
            () => "local " + v + "=(" + a + "*" + b + ")%" + (Math.floor(Math.random() * 97) + 3) + ";",
            () => "local function " + v + "(" + w + ") local " + x + "=" + w + " return " + x + " end;",
            () => "local " + v + "=\"" + Math.random().toString(36).slice(2, 10) + "\";",
            () => "local " + v + "=" + a + ";if (" + v + "*" + v + ")>=0 then " + v + "=" + v + "+" + b + " end;",
            () => "local " + v + "=" + a + ";if (" + v + "%1)~=0 then " + v + "=nil end;",
            () => "local " + v + "=" + b + ";while " + v + ">" + (a + b) + " do " + v + "=" + v + "-1 end;",
          ];
          return patterns[Math.floor(Math.random() * patterns.length)]();
        }
        const junk = (n) => Array.from({ length: n }, junkLine).join("");

        // Flatten program -> number stream (op, tag, [args])
        const nums = [];
        for (const inst of bytecode) {
          nums.push(inst.op);
          if (inst.arg === undefined) nums.push(0);
          else if (Array.isArray(inst.arg)) nums.push(2, inst.arg.length, ...inst.arg);
          else nums.push(1, inst.arg);
        }
        const opValues = OPS.map((n) => OP[n]);
        let s = 0;
        for (const v of opValues) s = (s + v) % 97;
        const mask = (s % 64) + 1;
        const blob = nums.map((n) => n ^ mask).join(",");

        // Constant pool serialized as a Lua table of tables (encoded numbers).
        const constLua = "{" + constPool.map((c) => "{" + c.join(",") + "}").join(",") + "}";

        const r = () => "_" + Math.random().toString(36).slice(2, 7);
        const B = r(), D = r(), P = r(), N = r(), I = r(), MK = r(), SM = r(), M = r(), C = r();
        const vmMin = scrambleVM(minifyLua(vmRaw));
        const opmapNamed = "{" + OPS.map((n) => n + "=" + OP[n]).join(",") + "}";
        const KV = r(), OV = r();
        const vmKeyed = vmMin.replace(/local KEY, OFFSET = 0x5A, 7/, "local KEY,OFFSET=" + KV + "," + OV);

        return (
          junk(4) +
          "local " + M + "=" + opmapNamed + ";" +
          junk(3) +
          "local " + SM + "=0;for _,v in pairs(" + M + ")do " + SM + "=(" + SM + "+v)%97 end;local " + MK + "=(" + SM + "%64)+1;" +
          "local " + KV + "=(45*2);local " + OV + "=(14/2);" +
          junk(3) +
          "local " + B + "=\"" + blob + "\";" +
          "local " + C + "=" + constLua + ";" +
          junk(2) +
          "local function " + D + "(s)local r={}for m in s:gmatch(\"[^,]+\")do r[#r+1]=tonumber(m)~" + MK + " end return r end;" +
          "local " + N + "=" + D + "(" + B + ");" +
          junk(3) +
          "local " + P + "={}local " + I + "=1;while " + I + "<=#" + N + " do local o=" + N + "[" + I + "];" + I + "=" + I + "+1;local t=" + N + "[" + I + "];" + I + "=" + I + "+1;" +
          "if t==0 then " + P + "[#" + P + "+1]={o} elseif t==1 then " + P + "[#" + P + "+1]={o," + N + "[" + I + "]};" + I + "=" + I + "+1 else local l=" + N + "[" + I + "];" + I + "=" + I + "+1;local a={}for k=1,l do a[k]=" + N + "[" + I + "];" + I + "=" + I + "+1 end;" + P + "[#" + P + "+1]={o,a} end end;" +
          vmKeyed + " " +
          "run(" + P + "," + M + "," + checksum + "," + C + ")"
        );
      }

      function setStatus(msg, cls) {
        const s = document.getElementById("status");
        s.textContent = msg;
        s.className = cls || "";
      }
      function run() {
        const src = document.getElementById("input").value;
        const outEl = document.getElementById("output");
        if (!src.trim()) { setStatus("No input to obfuscate.", "err"); return; }
        try {
          setStatus("Obfuscating...");
          const { OP, bytecode, constPool } = compile(src);
          const protectedLua = bundle(OP, bytecode, constPool);
          outEl.value = protectedLua;
          setStatus("Protected - " + bytecode.length + " instructions, randomized opcodes.", "ok");
        } catch (e) {
          outEl.value = "";
          setStatus(e.message, "err");
        }
      }
      function copyOut() {
        const o = document.getElementById("output");
        if (!o.value) { setStatus("Nothing to copy.", "err"); return; }
        navigator.clipboard.writeText(o.value).then(() => setStatus("Copied to clipboard.", "ok"));
      }
      function clearAll() {
        document.getElementById("input").value = "";
        document.getElementById("output").value = "";
        setStatus("Cleared.");
      }
    </script>
</body>
